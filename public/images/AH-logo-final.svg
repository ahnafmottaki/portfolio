<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- userSpaceOnUse so the gradient spans the whole mark, not each thin stroke -->
    <linearGradient id="strokeGrad" x1="90" y1="120" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#334155" stroke-width="1.5"/>

  <g fill="none" stroke="url(#strokeGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: left leg -->
    <path d="M 157 120 L 112 280"/>
    <!-- A: right leg — this same stroke doubles as H's left post -->
    <path d="M 157 120 L 205 280"/>
    <!-- A: crossbar -->
    <path d="M 130 210 L 182 210"/>
    <!-- H: right vertical -->
    <path d="M 285 120 L 285 280"/>
    <!-- H: crossbar joining the shared post to the right post -->
    <path d="M 205 205 L 285 205"/>
  </g>
</svg>
